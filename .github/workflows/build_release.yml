name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签 (例如 v1.0.0)'
        required: true
        type: string
      primary_version:
        description: '主发布版本 (例如 1.0.0)'
        required: true
        type: string
      is_test_mode:
        description: '是否处于测试发布模式 (跳过签名)'
        required: false
        type: boolean
        default: false
      enable_gh_nuget_push:
        description: '推送 NuGet 包到 GitHub Packages'
        required: false
        type: boolean
        default: true
      enable_nuget_org_push:
        description: '推送 NuGet 包到 nuget.org (需要配置 NUGET_ORG_KEY)'
        required: false
        type: boolean
        default: false

env:
  PDC_CLIENT_VERSION: 1.0.1.0
  SIGNPATH_ORG_ID: "a9190fa7-b054-4dd5-991c-7669d4a91f0c"
  SIGNPATH_PROJECT_SLUG: "ciiec-alpha"
  SIGNPATH_POLICY_SLUG: "ciiec-policy"
  GH_PACKAGES_USER: "HuaLaNN-HS"
  IS_TEST_MODE: ${{ github.event.inputs.is_test_mode || 'false' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
  PRIMARY_VERSION: ${{ github.event.inputs.primary_version || github.ref_name }}

jobs:
  build_app:
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || ( matrix.os == 'android' && 'ubuntu-24.04' || 'windows-2022' ) }}
    env:
      build_id: appBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_${{ matrix.package == 'folder' && 'appBase' || 'app' }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ env.IS_TEST_MODE }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
        experimental: [false]
        include:
          - os: macos
            package: pkg
            build_type: selfContained
            arch: arm64
            experimental: true
          - os: macos
            package: pkg
            build_type: selfContained
            arch: x64
            experimental: true
          - os: android
            package: apk
            build_type: monoaot
            arch: arm64
            experimental: true
          - os: android
            package: apk
            build_type: monoaot
            arch: x64
            experimental: true
    name: Build_App_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install macOS Workload
        if: ${{ matrix.os == 'macos' }}
        run: dotnet workload install macos --version 9.0.300

      - name: Install Android Workload
        if: ${{ matrix.os == 'android' }}
        run: |
          dotnet workload install android
          dotnet workload restore

      - name: Get Git Tag
        uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName

      - name: Build App (Nuke)
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          appVersion: ${{ steps.tagName.outputs.tag }}
          buildName: ${{ matrix.package == 'folder' && 'appBase' || 'app' }}
        run: ${{ (matrix.os == 'windows') && 'pwsh -ep bypass ./build.ps1 PublishApp' || './build.sh PublishApp' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            ./out/*.pkg
            ./out/*.apk
          retention-days: 5

  build_launcher:
    runs-on: windows-2022
    env:
      build_id: launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ env.IS_TEST_MODE }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['aot']
        package: ['singleFile']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
    name: Build_Launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build Launcher (Nuke)
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: launcher
        run: pwsh -ep bypass ./build.ps1 PublishLauncher

      - name: Upload Launcher Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ./out/*.zip
          retention-days: 5

  build_nupkg:
    runs-on: windows-2022
    name: Build_NuGet_Packages
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build NuGet Packages
        env:
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./build.ps1 BuildNupkg --isRelease $env:is_release

      - name: Add GitHub Packages Source
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          dotnet nuget add source --username ${{ env.GH_PACKAGES_USER }} --password ${{ secrets.GITHUB_TOKEN }} `
          --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ env.GH_PACKAGES_USER }}/index.json"

      - name: Push to GitHub Packages
        if: ${{ github.event.inputs.enable_gh_nuget_push != 'false' && github.event_name != 'pull_request' }}
        env:
          GHPKG_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push .\out\package\release\*.nupkg -k $env:GHPKG_KEY --source "github" --skip-duplicate

      - name: Push to nuget.org
        if: ${{ github.event.inputs.enable_nuget_org_push == 'true' && github.event_name != 'pull_request' }}
        run: |
          dotnet nuget push ./out/package/release/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out_nupkgs
          path: ./out/package/release/*.nupkg
          retention-days: 5

  sign_1:
    name: Sign_Artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' }}
    needs: [ build_app, build_launcher, build_nupkg ]
    steps:
      - name: Check SignPath Token
        id: check_token
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_TOKEN }}
        run: |
          echo "skip_sign=false" >> $GITHUB_OUTPUT
          if [ -z "${SP_TOKEN}" ]; then
            echo "skip_sign=true" >> $GITHUB_OUTPUT
            echo "::notice::SIGNPATH_TOKEN is empty, skipping signing process"
          fi

      - name: Checkout
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Get Commit Hash
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: prompt/actions-commit-hash@v3
        id: commit
        with:
          prefix: "${{ env.RELEASE_TAG }}+"

      - name: Download Windows Artifacts for Signing
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts
          pattern: "out_*windows*"

      - name: Create Sign Bundle
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        run: pwsh -ep Bypass -c ./tools/release-gen/create-sign-bundle.ps1

      - name: Upload Sign Bundle
        id: upload-sign-bundle
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sign-bundle
          path: ./ci_tmp/sign_bundle/*
          retention-days: 1

      - name: Sign Application (SignPath)
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_TOKEN }}'
          organization-id: '${{ env.SIGNPATH_ORG_ID }}'
          project-slug: '${{ env.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ env.SIGNPATH_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-sign-bundle.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './out_signed'
          parameters: |
            version: ${{ toJSON(steps.commit.outputs.long) }}

      - name: Upload Signed Files
        if: ${{ steps.check_token.outputs.skip_sign != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed_artifacts
          path: ./out_signed/*
          retention-days: 5

  pack_app:
    runs-on: windows-2022
    needs: [ sign_1, build_app, build_launcher ]
    if: ${{ always() && needs.sign_1.result != 'failure' && needs.build_app.result != 'failure' && needs.build_launcher.result == 'success' }}
    env:
      build_id: app_windows_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_app_windows_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ inputs.IS_TEST_MODE }}
      arch: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'installer']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
        exclude:
          - build_type: full
            package: installer
    name: Pack_App_Windows_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Download All Artifacts (Excluding Nupkgs)
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts
          pattern: "out_appBase_*,out_launcher_*,out_app_*,signed_artifacts"

      - name: Combine Artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package Structure
        env:
          package: ${{ matrix.package }}
          isRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: windows
          buildType: ${{ matrix.build_type }}
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile Inno Setup Installer
        if: ${{ matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ env.RELEASE_TAG || '2.0.0.0' }}
            /FClassIsland_Windows_${{ matrix.arch }}_${{ matrix.build_type }}_Installer.exe
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}

      - name: Upload Final Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe
          retention-days: 5

  publish:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build_nupkg.result == 'success' && needs.pack_app.result != 'failure' && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag) }}
    needs: [ pack_app, build_nupkg ]
    permissions:
      contents: write
    steps:
      - name: Validate Release Tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ ! "${{ github.ref }}" =~ ^refs/tags/v ]]; then
              echo "::error::Push event is not a valid tag (must start with v)"
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -z "${{ github.event.inputs.release_tag }}" ]]; then
              echo "::error::Release tag is required for manual dispatch"
              exit 1
            fi
          fi
          if [[ -z "${{ env.RELEASE_TAG }}" ]]; then
            echo "::error::RELEASE_TAG environment variable is empty"
            exit 1
          fi
          echo "Release tag is valid: ${{ env.RELEASE_TAG }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Download All Artifacts for Release
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts
          pattern: "*"

      - name: Create GitHub Release Draft
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./out_artifacts/out_app_windows_*/**/*.zip
            ./out_artifacts/out_app_windows_*/**/*.exe
            ./out_artifacts/out_launcher_windows_*/**/*.zip
            ./out_artifacts/out_app_macos_*/**/*.pkg
            ./out_artifacts/out_app_android_*/**/*.apk
            ./out_artifacts/out_nupkgs/**/*.nupkg
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_TAG }}
          name: "ClassIsland Intl ${{ env.RELEASE_TAG }}"
          body: "Auto-generated release for ${{ env.RELEASE_TAG }}"
          allowUpdates: true
